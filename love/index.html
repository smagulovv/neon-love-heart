<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030305">
  <meta name="description" content="Живое неоновое сердце, заполненное фразами «я люблю тебя» на разных языках.">
  <title>Neon Love Heart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" aria-label="Анимация сердца из программного кода">
    <canvas id="heart" aria-label="Неоновое сердце, заполненное фразами «я люблю тебя» на разных языках"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <section class="controls" aria-label="Настройки анимации">
      <button class="icon-button" id="replay" type="button" aria-label="Перезапустить анимацию" title="Перезапустить">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.8-2L20 12M4 12l2.6 5a7 7 0 0 0 11.8-2"/></svg>
      </button>
      <button class="icon-button" id="pause" type="button" aria-label="Остановить анимацию" title="Пауза">
        <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
        <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>
      </button>
      <label class="range-control" for="speed">
        <span>Скорость</span>
        <input id="speed" type="range" min="0.5" max="1.8" step="0.1" value="1" aria-label="Скорость формирования">
      </label>
      <label class="range-control" for="glow">
        <span>Свечение</span>
        <input id="glow" type="range" min="0" max="1.5" step="0.05" value="0.8" aria-label="Интенсивность свечения">
      </label>
      <label class="select-control" for="palette">
        <span>Цвет</span>
        <select id="palette" aria-label="Цветовая палитра">
          <option value="neon">Фиолетовый + зелёный</option>
          <option value="violet">Только фиолетовый</option>
        </select>
      </label>
    </section>
    <p class="sr-only" id="status" aria-live="polite">Анимация формируется</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
